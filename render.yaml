# Render blueprint: New > Blueprint > pick this repo. A persistent disk (needs a paid instance type) keeps your data across deploys.
services:
  - type: web
    name: fyndr
    runtime: node
    plan: starter
    buildCommand: echo "nothing to build"
    startCommand: node server.js
    healthCheckPath: /healthz # liveness. /readyz is the readiness probe (503 while shutting down); /metrics needs METRICS_TOKEN
    numInstances: 1 # KEEP AT 1: data.json and the rate limiter live in this one process. See docs/RUNBOOK.md, "Scaling limits"
    disk:
      name: fyndr-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PHONE_EMAIL_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
