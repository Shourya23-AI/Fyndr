<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fyndr: phone verification</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px system-ui, sans-serif;
        background: #f4f2ec;
        color: #2d3330;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #181a17;
          color: #e6e4dc;
        }
      }
      a {
        color: inherit;
        font-weight: 700;
      }
      .spin {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 6px;
        vertical-align: -2px;
        border: 2px solid #c9c6bb;
        border-top-color: #4f8a6f;
        border-radius: 50%;
        animation: s .8s linear infinite;
      }
      @keyframes s {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <p id="m"><span class="spin"></span> Finishing up…</p>
      <p id="b" hidden><a id="back" href="index.html#/phone">Continue to Fyndr</a></p>
    </div>
    <script src="phone-callback.js"></script>
  </body>
</html>
