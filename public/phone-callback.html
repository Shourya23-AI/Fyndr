<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fyndr: phone verification</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px system-ui, sans-serif;
        background: #f4f2ec;
        color: #2d3330;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #181a17;
          color: #e6e4dc;
        }
      }
      a {
        color: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div>
      <p id="m">Finishing up…</p>
      <p><a href="index.html#/phone">Back to Fyndr</a></p>
    </div>
    <script>
      // phone.email sends the popup back here with ?access_token=… . Hand the token to the Fyndr
      // tab that opened the popup and close. If no tab confirms receipt (popup was blocked and we
      // are in the full-page flow), keep the token for this tab and go back to the app.
      const message = document.getElementById("m");
      const token = new URLSearchParams(location.search).get("access_token");

      function backToApp() {
        for (const store of [sessionStorage, localStorage]) {
          try {
            store.setItem("fyndr-phone-token", token);
          } catch {} // storage can be blocked by privacy settings
        }
        location.replace("index.html#/phone");
      }

      if (!token) {
        message.textContent = "Verification was not completed. You can close this window.";
      } else {
        const payload = { type: "fyndr-phone-token", token };
        history.replaceState(null, "", location.pathname); // keep the token out of the address bar

        let channel = null;
        try {
          channel = new BroadcastChannel("fyndr-phone");
        } catch {}

        let received = false;
        if (channel) {
          channel.onmessage = (e) => {
            if (e.data && e.data.type === "fyndr-phone-ack") {
              received = true;
            }
          };
          channel.postMessage(payload);
        }
        try {
          window.opener && window.opener.postMessage(payload, location.origin);
        } catch {}

        const handedOver = () => {
          message.textContent = "Phone verified. You can close this window.";
          setTimeout(() => window.close(), 500);
        };

        if (!channel) {
          // Very old browser: nothing to wait for, rely on the opener message.
          window.opener ? handedOver() : backToApp();
        } else {
          setTimeout(() => (received ? handedOver() : backToApp()), 900);
        }
      }
    </script>
  </body>
</html>
