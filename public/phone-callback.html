<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fyndr: phone verification</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#f4f2ec;color:#2d3330;text-align:center;padding:24px}
@media(prefers-color-scheme:dark){body{background:#181a17;color:#e6e4dc}}a{color:inherit;font-weight:700}</style></head>
<body><div><p id="m">Finishing up…</p><p><a href="index.html#/phone">Back to Fyndr</a></p></div>
<script>
// phone.email sends the popup back here with ?access_token=… ; hand it to the Fyndr tab that opened the popup, then close.
const m=document.getElementById('m'),t=new URLSearchParams(location.search).get('access_token');
if(!t){m.textContent='Verification was not completed. You can close this window.'}
else{
  const msg={type:'fyndr-phone-token',token:t};let bc;
  try{bc=new BroadcastChannel('fyndr-phone');bc.postMessage(msg)}catch{}
  try{window.opener&&window.opener.postMessage(msg,location.origin)}catch{}
  history.replaceState(null,'',location.pathname); // keep the token out of the address bar
  m.textContent='Phone verified. You can close this window.';
  setTimeout(()=>{try{bc&&bc.close()}catch{}window.close()},700);
}
</script></body></html>
